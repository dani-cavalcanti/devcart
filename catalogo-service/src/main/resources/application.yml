server:
  port: 8081

spring:
  application:
    name: catalogo-service
  cloud:
    # Boot 3.4.x + Spring Cloud 2023.0.x fora da matriz oficialmente testada (assumido).
    compatibility-verifier:
      enabled: false
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/catalogo}
      auto-index-creation: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # Micrometer Observation + Micrometer Tracing (bridge Brave) -> Zipkin
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
